# Week 18: lint + unit tests + CLI entrypoints. No deploy, OIDC, or image publish.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      # Extra vs test_end_to_end: packaged CLI and default data/artifacts paths.
      - run: python -m energy_ml.cli pipeline --days 30
      - run: python -m energy_ml.cli train
      - run: python -m ruff check src tests
